name: onchain-indexer

x-app: &app
  build: .
  restart: unless-stopped
  env_file: .env
  depends_on:
    db:
      condition: service_healthy
  environment:
    DATABASE_URL: postgres://ponder:${POSTGRES_PASSWORD}@db:5432/ponder
    NODE_OPTIONS: --max-old-space-size=512

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ponder
      POSTGRES_DB: ponder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ponder -d ponder"]
      interval: 10s
      retries: 5
    mem_limit: 512m
    # No published ports: Postgres is reachable only from the app containers.

  # Writes the index. Each `ponder start` run indexes up to the lagged head and idles; the loop stops it,
  # waits and starts again (catch-up mode). Crash recovery resumes from the checkpoint.
  indexer:
    <<: *app
    command:
      - sh
      - -c
      - |
        while true; do
          timeout -s TERM "$${INDEX_RUN_SECONDS:-120}" npx ponder start --schema "$${DEPLOYMENT_ID:-v1}" --port 42070
          sleep "$${INDEX_PAUSE_SECONDS:-30}"
        done
    mem_limit: 768m
    cpus: 1.0

  # Serves the public read-only API from the same schema; stays up while the indexer cycles.
  api:
    <<: *app
    ports:
      # Localhost only; the host nginx terminates TLS and proxies to it.
      - "127.0.0.1:42069:42069"
    mem_limit: 512m
    cpus: 0.5

volumes:
  pgdata:

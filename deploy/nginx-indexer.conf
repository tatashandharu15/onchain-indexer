# /etc/nginx/sites-available/indexer.tatas.anxentlab.my.id
# Read-only public API. TLS is added by certbot (--nginx).

limit_req_zone $binary_remote_addr zone=indexer_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name indexer.tatas.anxentlab.my.id;

    client_max_body_size 64k;

    location / {
        limit_req zone=indexer_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:42069;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /sql/* uses server-sent events for live queries.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
